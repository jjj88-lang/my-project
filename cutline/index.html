<title>Cutline Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, scoreboard numerals over a running-track progress bar, fixed three-tab bar. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#131922; --muted:#5A6676; --line:#D8DEE7; --track:#E2E7EE;
  --accent:#2447E0; --accent-ink:#FFFFFF; --burn:#C96A06; --fat:#0B857B; --good:#17804A; --bad:#C43030;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1117; --surface:#161C25; --ink:#E9EEF5; --muted:#95A2B4; --line:#293241; --track:#242C39;
  --accent:#8FA5FF; --accent-ink:#0D1117; --burn:#F2A03D; --fat:#4CC9BD; --good:#4CC585; --bad:#FF7B72; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161C25; --ink:#E9EEF5; --muted:#95A2B4; --line:#293241; --track:#242C39;
  --accent:#8FA5FF; --accent-ink:#0D1117; --burn:#F2A03D; --fat:#4CC9BD; --good:#4CC585; --bad:#FF7B72; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:22px} h3{font-size:18px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;align-items:center;gap:10px} .row > .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.brand i{font-style:normal;color:var(--accent)}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--track);color:var(--ink);white-space:nowrap}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav .d{font-family:var(--display);font-size:20px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{padding:18px 16px 16px}
.hero .big{font-size:76px;line-height:.9}
.hero .big.over{color:var(--bad)}
.lane{position:relative;height:16px;border-radius:4px;background:var(--track);overflow:hidden;margin:14px 0 12px}
.lane .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px 0 0 4px}
.lane .fill.over{background:var(--bad)}
.lane .earned{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--burn) 4px 6px);opacity:.75}
.eq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eq div{min-width:0}
.eq .num{font-size:24px;display:block}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macro .bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin:6px 0 4px}
.macro .bar span{display:block;height:100%;border-radius:3px}
.macro .num{font-size:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .k{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--track)}
.thumb.ph{display:grid;place-items:center;color:var(--muted)}
.thumb.ph svg{width:22px;height:22px}
.empty{color:var(--muted);font-size:15px;padding:6px 0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.warn{border-left-color:var(--burn)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;padding:8px 2px;border-radius:10px;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--track)}

.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,18,.55)}
.sheet .panel{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;font-size:18px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input.in,select.in,textarea.in{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-weight:500}
textarea.in{min-height:76px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-height:42px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ritem{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:600}
.step .m{min-width:44px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .num{font-size:34px;line-height:1;display:block;margin-top:4px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font:500 11px var(--body);fill:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv b{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.rules b{font-weight:600}
.coach{white-space:pre-wrap;font-size:15px}
.msgs{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-top:8px}
.composer textarea{min-height:48px;max-height:140px;background:var(--surface)}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{text-align:left;justify-content:flex-start;font-weight:500}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Cut<i>line</i></div>
    <span class="chip" id="streak" hidden></span>
  </header>
  <main id="view" class="stack" style="gap:14px"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-act="tab" data-tab="today">Today</button>
  <button data-act="tab" data-tab="ask">Ask</button>
  <button data-act="tab" data-tab="progress">Progress</button>
  <button data-act="tab" data-tab="plan">Plan</button>
</div></nav>
<div id="sheet" class="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="lib" accept="image/*" hidden>
<input type="file" id="shot" accept="image/*" hidden>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const pos=v=>{const n=num(v);return n!=null&&n>=0?n:0};
const dstr=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>dstr(new Date());
const asDate=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=asDate(s);d.setDate(d.getDate()+n);return dstr(d)};
const dayDiff=(a,b)=>Math.round((asDate(b)-asDate(a))/864e5);
const nice=s=>s===today()?'Today':s===addDays(today(),-1)?'Yesterday':asDate(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const IC={
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 12v9M17 3c-2 2-3 5-3 8h3zm0 8v10"/></svg>',
  run:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="4.5" r="1.8"/><path d="M6 11l4-3 4 1 2 4 3 1M10 8l-1 6 4 3 1 5M9 14l-2 4-4 1"/></svg>'
};

/* ---------- state + storage ---------- */
const LS='cutline.v1';
const PROFILE0={sex:null,age:18,heightIn:66,weight:150,activity:1.2,rate:1,bf:null,waist:null,neck:null,hip:null,adj:0,start:today(),u:0};
const S={profile:clone(PROFILE0),days:{},tab:'today',date:today()};
let sync='local'; // local | loading | synced | error
try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&j.profile){S.profile=Object.assign(clone(PROFILE0),j.profile);S.days=j.days||{};}}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({profile:S.profile,days:S.days}))}catch(e){}}

let col=null;const pending={},writing={};
const docBody=id=>id==='profile'?S.profile:S.days[id.slice(2)];
function persist(id){saveLocal();if(!col)return;pending[id]=true;pump(id);}
async function pump(id){
  if(writing[id])return;writing[id]=true;
  while(pending[id]){
    pending[id]=false;
    try{await col.doc(id).set(clone(docBody(id)));if(sync==='error'){sync='synced';}}
    catch(e){
      sync='error';
      toast(e&&e.code==='quota_exceeded'?'Storage is full. Older days can\'t be saved until some are removed.':'Couldn\'t save to your account. Kept on this device.');
      break;
    }
  }
  writing[id]=false;
}
function applyRemote(id,body){
  if(!body||pending[id]||writing[id])return false;
  const local=docBody(id);
  if(local&&(local.u||0)>=(body.u||0))return false;
  if(id==='profile')S.profile=Object.assign(clone(PROFILE0),clone(body));
  else if(/^d-\d{4}-\d\d-\d\d$/.test(id)){const d=clone(body);d.meals=Array.isArray(d.meals)?d.meals:[];d.ex=Array.isArray(d.ex)?d.ex:[];S.days[id.slice(2)]=d;}
  else return false;
  return true;
}
async function initDb(){
  const C=window.claude;if(!C||!C.use)return;
  sync='loading';
  let db=null,user=null,id=null;
  try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);id=user?await user.id():null;}catch(e){}
  if(!db||!id){sync='local';softRender();return;}
  col=db.collection('data/users/'+id);
  let first=true;
  const timer=setTimeout(()=>{if(sync==='loading'){sync='slow';softRender();}},10000);
  col.limit(1000).onSnapshot(snap=>{
    let changed=false;const seen={};
    snap.docs.forEach(d=>{seen[d.id]=1;if(applyRemote(d.id,d.data()))changed=true;});
    if(!snap.metadata.fromCache){
      clearTimeout(timer);
      if(first){
        first=false;
        // push anything newer or missing that this device logged before the account store answered
        const ids=['profile'].concat(Object.keys(S.days).map(k=>'d-'+k));
        const remote={};snap.docs.forEach(d=>{remote[d.id]=(d.data()||{}).u||0;});
        ids.forEach(k=>{const b=docBody(k);if(b&&(b.u||0)>(remote[k]==null?-1:remote[k])&&(b.u||0)>0)persist(k);});
      }
      sync='synced';changed=true;
    }
    if(changed){saveLocal();softRender();}
  },()=>{clearTimeout(timer);sync='error';softRender();});
}

/* ---------- AI ---------- */
let AI=null,aiImages=false,aiTools=false;
const aiReady=(async()=>{
  const C=window.claude;if(!C||!C.use)return;
  try{AI=await C.use('sample');}catch(e){AI=null;}
  if(AI){try{const l=await AI.limits();aiImages=!!(l&&l.images);aiTools=!!(l&&l.tools);}catch(e){aiImages=false;}}
})();
function aiMsg(e){
  const c=e&&e.code;
  if(c==='not_granted')return 'Claude access was declined for this page, so photo estimates are off. You can still type in numbers.';
  if(c==='rate_limited')return 'Claude is at its usage limit right now. Try again in a bit, or type in numbers.';
  if(c==='image_rejected')return 'That photo could not be read. Try a different one.';
  if(c==='images_unavailable')return 'Photos can\'t be sent to Claude from here. Describe the meal in words instead.';
  if(c==='invalid_json')return 'The estimate came back garbled. Try once more.';
  if(c==='cancelled')return '';
  return 'The estimate didn\'t go through. Check your connection and try again.';
}
const FOOD_RULES='Estimate like a careful dietitian. List each distinct food or drink as its own item. Judge portion size from the plate, utensils, hands and packaging. Include cooking oil, butter, dressings and sauces that are likely present even if not visible. Use realistic restaurant portions when it looks like restaurant food. Do not lowball.\n'
 +'Reply with only a JSON object in this exact shape:\n{"title":"short meal name","items":[{"name":"food","portion":"amount, e.g. 1 cup or 6 oz","kcal":0,"protein_g":0,"carbs_g":0,"fat_g":0}],"confidence":"low|medium|high","note":"one short sentence on the biggest source of uncertainty"}\n'
 +'If there is no food or drink, reply {"title":"","items":[],"confidence":"low","note":"why"}.';
async function prepImage(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    const t=document.createElement('canvas');t.width=t.height=128;
    const s=Math.min(img.naturalWidth,img.naturalHeight);
    t.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,128,128);
    return {blob,thumb:t.toDataURL('image/jpeg',.6),preview:c.toDataURL('image/jpeg',.6)};
  }finally{URL.revokeObjectURL(url);}
}

/* ---------- the math ---------- */
function weights(){return Object.keys(S.days).filter(k=>num(S.days[k].weight)!=null).sort().map(k=>({d:k,w:+S.days[k].weight}));}
function trend(){const ws=weights();let t=null;return ws.map(x=>{t=t==null?x.w:t+.25*(x.w-t);return {d:x.d,w:x.w,t};});}
function curWeight(){const t=trend();return t.length?t[t.length-1].t:(num(S.profile.weight)||150);}
const setupDone=()=>!!S.profile.sex;
function bmr(){ // Mifflin-St Jeor
  const p=S.profile,kg=curWeight()*.45359,cm=(num(p.heightIn)||66)*2.54,age=num(p.age)||18;
  return 10*kg+6.25*cm-5*age+(p.sex==='f'?-161:5);
}
const minor=()=>num(S.profile.age)!=null&&S.profile.age<18;
const deficit=()=>minor()?0:(num(S.profile.rate)||0)*500;
const floorK=()=>S.profile.sex==='f'?1200:1500;
function getDay(d,make){let x=S.days[d];if(!x&&make){x=S.days[d]={meals:[],ex:[],weight:null,health:null,u:0};}return x||{meals:[],ex:[],weight:null,health:null};}
function mealTot(m){return (m.items||[]).reduce((a,i)=>{a.kcal+=+i.kcal||0;a.p+=+i.p||0;a.c+=+i.c||0;a.f+=+i.f||0;return a;},{kcal:0,p:0,c:0,f:0});}
function dayTot(d){return getDay(d).meals.reduce((a,m)=>{const t=mealTot(m);a.kcal+=t.kcal;a.p+=t.p;a.c+=t.c;a.f+=t.f;return a;},{kcal:0,p:0,c:0,f:0});}
function burn(d){ // calories out for a day
  const day=getDay(d),b=bmr(),adj=num(S.profile.adj)||0;
  const h=day.health&&num(day.health.active);
  if(h!=null){return {base:b*1.1+adj,ex:h,total:b*1.1+adj+h,src:'health'};}
  const ex=day.ex.reduce((a,e)=>a+(+e.kcal||0),0);
  const base=b*(num(S.profile.activity)||1.2)+adj;
  return {base,ex,total:base+ex,src:'log'};
}
function target(d){const b=burn(d),raw=b.total-deficit(),fl=floorK();return {kcal:Math.max(fl,raw),floored:raw<fl,burn:b};}
function macros(k){
  const lb=curWeight(),p=Math.round(lb/5)*5,f=Math.round(lb*.35),c=Math.max(0,Math.round((k-p*4-f*9)/4));
  return {p,f,c};
}
const MET={Run:null,Walk:3.5,Lifting:3.5,Cycling:7,Swim:7,HIIT:8,Other:5};
function exKcal(type,miles,mins){
  const lb=curWeight();
  if(type==='Run'&&miles)return Math.round(.63*lb*miles);       // net cost of running, about 0.63 kcal per lb per mile
  if(type==='Walk'&&miles)return Math.round(.30*lb*miles);
  const met=MET[type]||(type==='Run'?9.8:5);
  return mins?Math.round((met-1)*lb*.45359*mins/60):0;           // net of resting burn, so nothing is counted twice
}
function streak(){let n=0,d=today();if(!getDay(d).meals.length)d=addDays(d,-1);while(getDay(d).meals.length){n++;d=addDays(d,-1);}return n;}
function measured(){ // real-world burn from intake and scale trend over the last 21 days
  const end=today(),start=addDays(end,-20);let n=0,eat=0,pred=0;const pts=[];
  for(let d=start;d<=end;d=addDays(d,1)){
    const t=dayTot(d);if(t.kcal>=600){n++;eat+=t.kcal;pred+=burn(d).total-(num(S.profile.adj)||0);}
    const w=num(getDay(d).weight);if(w!=null)pts.push([dayDiff(start,d),w]);
  }
  if(n<10||pts.length<5||pts[pts.length-1][0]-pts[0][0]<10)return {ready:false,n,w:pts.length};
  const mx=pts.reduce((a,p)=>a+p[0],0)/pts.length,my=pts.reduce((a,p)=>a+p[1],0)/pts.length;
  const slope=pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/pts.reduce((a,p)=>a+(p[0]-mx)*(p[0]-mx),0);
  const tdee=eat/n-slope*3500,predicted=pred/n;
  return {ready:true,tdee,predicted,adj:Math.max(-500,Math.min(500,Math.round(tdee-predicted))),perWeek:slope*7};
}
function bodyFat(){
  const p=S.profile;if(num(p.bf)!=null&&p.bf>3)return {v:+p.bf,src:'your estimate'};
  const h=num(p.heightIn),w=num(p.waist),n=num(p.neck),hip=num(p.hip);
  if(p.sex==='m'&&w&&n&&w>n){return {v:86.010*Math.log10(w-n)-70.041*Math.log10(h)+36.76,src:'tape measure'};}
  if(p.sex==='f'&&w&&n&&hip&&w+hip>n){return {v:163.205*Math.log10(w+hip-n)-97.684*Math.log10(h)-78.387,src:'tape measure'};}
  return null;
}

function weightChart(){

  const W=340,H=150,L=34,R=8,T=10,B=22,x0=asDate(t[0].d),span=Math.max(1,dayDiff(t[0].d,t[t.length-1].d));
  const vals=t.flatMap(p=>[p.w,p.t]);let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const X=p=>L+(dayDiff(t[0].d,p.d)/span)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const mid=Math.round((lo+hi)/2);

    ${t.map(p=>`<circle cx="${X(p)}" cy="${Y(p.w)}" r="2.5" fill="var(--muted)" opacity=".55"/>`).join('')}

    <text x="${W-R}" y="${H-5}" text-anchor="end">${asDate(t[t.length-1].d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text></svg>

const scrollEnd=()=>window.scrollTo(0,document.documentElement.scrollHeight);
async function askSend(q){
  q=(q||'').trim().slice(0,2000);if(!q||asking)return;
  await aiReady;if(!AI){toast('Asking needs this page open in Claude.');return;}
  const last={role:'assistant',content:''};chat.push({role:'user',content:q},last);asking=true;render();scrollEnd();
  const hist=chat.slice(0,-1).slice(-17);while(hist.length&&hist[0].role!=='user')hist.shift();
  const msgs=hist.map((m,i)=>({role:m.role,content:i===0?askContext()+'\n\nMy message: '+m.content:m.content}));
  const opts={cache:false,onText:x=>{last.content=x.text;const b=$('#ask-live');if(b)b.textContent=x.text||'Thinking…';}};
  if(aiTools)opts.tools=ASK_TOOLS;
  let failed='';
  try{const r=await AI(msgs,opts);last.content=(r&&r.text)||last.content||'Done.';}
  catch(e){if(e&&e.text)last.content=e.text;else{chat.splice(chat.length-2,2);failed=q;}toast(aiMsg(e));}
  asking=false;saveChat();render();
  if(failed){const ta=$('#ask-in');if(ta)ta.value=failed;}else scrollEnd();
}

async function analyze(file,kind){
  if(!file)return;
  await aiReady;
  if(!AI||!aiImages){errSheet('Photo estimate','Photo estimates work when this page is open in Claude and allowed to send images. You can describe the meal or type in numbers instead.');return;}
  loadingSheet(kind==='health'?'Reading screenshot':'Reading your plate','Getting it ready…');
  let img;try{img=await prepImage(file,kind==='health'?1600:1280);}catch(e){errSheet('Photo','That photo could not be opened. Try another one.');return;}
  loadingSheet(kind==='health'?'Reading screenshot':'Reading your plate',kind==='health'?'Pulling out your numbers…':'Identifying foods and portions…',img.preview);
  aiAbort=new AbortController();const mine=aiAbort;
  try{
    if(kind==='health'){
      const r=await AI.json('This is a screenshot from Apple Health, Apple Fitness or a running watch app. Today is '+today()+'. Extract what it shows. Convert kilometers to miles and kilograms to pounds. Use null for anything not shown. "Active" or "Move" calories are active_kcal; never use total calories for it.\nReply with only JSON: {"date":"YYYY-MM-DD or null","active_kcal":null,"steps":null,"weight_lb":null,"workouts":[{"type":"Run","minutes":null,"distance_mi":null,"kcal":null}]}',{images:[img.blob],signal:mine.signal,cache:false});
      if(mine.signal.aborted)return;
      healthConfirm(r||{});
    }else{
      const r=await AI.json('This is a photo of something I am about to eat or drink. '+FOOD_RULES,{images:[img.blob],signal:mine.signal,cache:false});
      if(mine.signal.aborted)return;
      const items=normItems(r&&r.items);
      if(!items.length){errSheet('No food found',(r&&r.note)||'Claude could not see food in that photo.');return;}
      draft={title:String(r.title||'Meal').slice(0,60),items,thumb:img.thumb,src:'photo',note:String(r.note||''),conf:r.confidence,date:S.date};
      reviewSheet();
    }
  }catch(e){if(mine.signal.aborted)return;const m=aiMsg(e);if(m)errSheet('Estimate',m);}
  finally{if(aiAbort===mine)aiAbort=null;}
}

    if(a!=null||s!=null)day.health={active:a==null?(day.health&&day.health.active!=null?day.health.active:null):Math.round(a),steps:s==null?null:Math.round(s)};
    if(w!=null&&w>60&&w<500)day.weight=Math.round(w*10)/10;
    draft.wk.forEach(x=>{day.ex.push({id:uid(),type:x.type,miles:x.miles?Math.round(x.miles*100)/100:null,mins:x.mins?Math.round(x.mins):null,kcal:Math.round(x.kcal||exKcal(/run/i.test(x.type)?'Run':'Other',x.miles,x.mins))});});
    S.date=d;closeSheet();touchDay(d);toast('Imported.');
  },
  'w-save'(){const w=num($('#w-in').value);if(!w||w<60||w>500){toast('Enter your weight in pounds.');return;}getDay(S.date,true).weight=Math.round(w*10)/10;closeSheet();touchDay(S.date);},
  'w-clear'(){getDay(S.date,true).weight=null;closeSheet();touchDay(S.date);},
  'apply-adj'(el){S.profile.adj=+el.dataset.v||0;saveProfile();render();toast('Budget now uses your measured burn.');},
  'ask-send'(el){const ta=$('#ask-in');askSend(el.dataset.q||(ta?ta.value:''));},
  'ask-clear'(el){if(asking)return;if(!el.dataset.sure){el.dataset.sure=1;el.textContent='Tap again to clear';return;}chat=[];saveChat();render();},
  async coach(el){
    await aiReady;if(!AI){toast('The coach needs this page open in Claude.');return;}
    const lines=weekLines();
    const p=S.profile,bf=bodyFat();
    el.disabled=true;const out=$('#coach');out.textContent='Thinking…';
    try{
      const r=await AI('You are a direct, evidence-based fat-loss coach for a daily runner who wants visible abs while keeping muscle. Profile: '+(p.sex==='f'?'female':p.sex==='m'?'male':'sex not given')+', age '+(p.age||'unknown')+', '+Math.floor(p.heightIn/12)+'ft '+Math.round(p.heightIn%12)+'in, trend weight '+curWeight().toFixed(1)+' lb'+(bf?', about '+bf.v.toFixed(0)+'% body fat':'')+', goal pace '+p.rate+' lb/week, protein goal '+macros(2000).p+' g.\nLast 7 days:\n'+lines.join('\n')+'\n\nWrite a review in under 130 words of plain text, no markdown: one sentence on how the week went, then exactly three specific actions for next week, each on its own line starting with "- ". Use the numbers. If little was logged, say that logging is the first fix. Never recommend eating below '+floorK()+' kcal.',
        {cache:false,onText:x=>{coachText=x.text;const o=$('#coach');if(o)o.textContent=x.text;}});
      coachText=r.text;const o=$('#coach');if(o)o.textContent=r.text;
    }catch(e){coachText='';const o=$('#coach');if(o)o.textContent='';toast(aiMsg(e));}
    const b=$('#coach-btn');if(b)b.disabled=false;
  }
};
function keepTitle(){const t=$('#r-title');if(t&&draft)draft.title=t.value.trim().slice(0,60);}
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return;}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=A[el.dataset.act];if(f)f(el);
});
document.addEventListener('input',e=>{if(e.target.id==='ex-mi'||e.target.id==='ex-min')exEstimate();});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='cam'||el.id==='lib'||el.id==='shot'){const f=el.files&&el.files[0];el.value='';analyze(f,el.id==='shot'?'health':'food');return;}
  const k=el.dataset&&el.dataset.pf;if(!k)return;
  const p=S.profile,v=num(el.value);
  if(k==='ft'||k==='in'){const ft=num($('#pf-ft').value)||5,inch=num($('#pf-in').value)||0;p.heightIn=Math.max(48,Math.min(90,ft*12+inch));}
  else if(k==='age')p.age=v&&v>=13&&v<=90?Math.round(v):null;
  else p[k]=v!=null&&v>0?v:null;
  if(k==='weight'&&!p.weight)p.weight=150;
  saveProfile();
  const pn=$('#plan-nums');if(pn)pn.innerHTML=planNumbers();
  const ab=$('#abs');if(ab)ab.innerHTML=absCard();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='ask-in'&&matchMedia('(pointer:fine)').matches){e.preventDefault();askSend(e.target.value);return;}if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

window.__cutline={S,bmr,target,exKcal,macros,measured,bodyFat};
render();
initDb();
})();
</script>
